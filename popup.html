<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Anki Quick Adder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 16px;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }
    .status {
      margin-bottom: 16px;
      font-size: 14px;
    }
    .card-count {
      font-weight: bold;
      color: #0078d7;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      background-color: #fff;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #f0f0f0;
    }
    .btn-primary {
      background-color: #0078d7;
      color: white;
      border-color: #0060ac;
    }
    .btn-primary:hover {
      background-color: #0060ac;
    }
    .btn-danger {
      color: #d32f2f;
      border-color: #ffcdd2;
    }
    .btn-danger:hover {
      background-color: #ffebee;
    }
    .instructions {
      margin-top: 16px;
      font-size: 11px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>Anki Quick Adder</h2>
  
  <div class="status">
    Pending cards: <span class="card-count" id="card-count">0</span>
  </div>
  
  <div class="btn-group">
    <button class="btn-primary" id="export-btn">Export for Anki (.txt)</button>
    <button id="view-cards-btn">View Cards</button>
    <button class="btn-danger" id="clear-btn">Clear Pending Cards</button>
  </div>
  
  <div class="instructions">
    <strong>To Import:</strong> In Anki, go to File > Import. Select the downloaded .txt file. Ensure "Fields separated by" is set to Tab, and check "Allow HTML in fields".
  </div>

  <script src="popup.js"></script>
</body>
</html>
